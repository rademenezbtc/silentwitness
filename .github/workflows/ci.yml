name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,embit]'
      - run: ruff check . && ruff format --check .
      - run: silentwitness verify-vectors
      - run: pytest -q

  # Baseline against embit's unreleased silent-payments branch. Findings on
  # unreleased branches are public under the disclosure policy, so the evidence
  # is uploaded as a CI artifact. Never add released-firmware cases here.
  baseline-embit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[embit]'
      - name: Run BIP 375 baseline
        run: silentwitness run --adapter embit --out evidence/ci --note "CI ${{ github.sha }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-embit
          path: evidence/ci
          retention-days: 30
