name: scorecard

# Runs every suite against every adapter that works in CI (embit, Krux, rust-psbt, BitBox02 on each firmware simulator), builds the
# scorecard page and publishes it to GitHub Pages. Only unreleased signer code runs
# here, plus BitBox02 releases whose bug is fixed and public; other released-firmware
# results stay private until the disclosure policy allows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

env:
  BITBOX_API_COMMIT: 0663f047bdbe821ef2bbcda58620b8e828f961df

jobs:
  # BitBox02: the official firmware simulators, the two latest releases (9.26.5, 9.27.1), one scorecard row per version.
  # Third-party code, same rules as Krux: pinned commit, simulators verified by sha256, read-only,
  # no secrets, only evidence leaves the job. 9.21.0 to 9.26.3 are in the range hit by the
  # lock-funds bug fixed in 9.26.5 (public: https://blog.bitbox.swiss/en/bitbox-08-2026-dixence-update/),
  # so the disclosure policy allows publishing them. There is no 9.26.4 simulator. Anything
  # unexpected on fixed firmware is NOT a known bug: take the page down and follow
  # docs/disclosure-policy.md. Simulator checksums come from tests/simulators.json at
  # BITBOX_API_COMMIT in bitbox-api-rs.
  bitbox02-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Fetch bitbox-api-rs at the pinned commit and apply the silent-payment patch
        run: |
          git clone https://github.com/BitBoxSwiss/bitbox-api-rs.git "$RUNNER_TEMP/bitbox-api-rs"
          git -C "$RUNNER_TEMP/bitbox-api-rs" checkout "$BITBOX_API_COMMIT"
          git -C "$RUNNER_TEMP/bitbox-api-rs" apply --verbose "$GITHUB_WORKSPACE/tools/bitbox02_spike/sp-spike.patch"
      - name: Build the harness
        working-directory: ${{ runner.temp }}/bitbox-api-rs
        run: |
          cp "$GITHUB_WORKSPACE/tools/bitbox02_harness/harness.rs" examples/sw_harness.rs
          cargo +stable build --release --features simulator,tokio --example sw_harness
      - uses: actions/upload-artifact@v4
        with:
          name: bitbox02-harness
          path: ${{ runner.temp }}/bitbox-api-rs/target/release/examples/sw_harness
          retention-days: 7

  bitbox02:
    needs: bitbox02-harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixed (9.26.5 and later)
          - { version: v9.26.5, affected: false, sha256: 21a394c3d7642e0a251b340fba9b601742ae98c3790e439b6258b55e1a4585bf }
          - { version: v9.27.1, affected: false, sha256: 0b049efb21dcf8a447e9f46c660c731e38fb83101023d4f80f1f423ddaa4126b }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: bitbox02-harness
          path: ${{ runner.temp }}/harness
      - name: Fetch the firmware simulator and verify its checksum
        env:
          VERSION: ${{ matrix.version }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          # The adapter reads the firmware version from the file name.
          sim="$RUNNER_TEMP/bitbox02-multi-$VERSION-simulator"
          curl -sSfL -o "$sim" \
            "https://github.com/BitBoxSwiss/bitbox02-firmware/releases/download/firmware%2F${VERSION}/bitbox02-multi-${VERSION}-simulator1.0.0-linux-amd64"
          echo "$SHA256  $sim" | sha256sum -c
          chmod +x "$sim" "$RUNNER_TEMP/harness/sw_harness"
      - name: Run the bitbox02 suite against the simulator
        # On firmware in the affected range a failing attack case is the finding, not a CI error.
        # On fixed firmware every case must pass.
        continue-on-error: ${{ matrix.affected }}
        env:
          SW_BITBOX02_SIMULATOR: ${{ runner.temp }}/bitbox02-multi-${{ matrix.version }}-simulator
          SW_BITBOX02_HARNESS: ${{ runner.temp }}/harness/sw_harness
        run: |
          silentwitness run --adapter bitbox02 --suite bitbox02 \
            --out "evidence/bitbox02-${{ matrix.version }}" --note "CI ${{ github.sha }}"
      - name: Show the verdicts
        if: always()
        run: cat evidence/bitbox02-${{ matrix.version }}/*/summary.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitbox02-evidence-${{ matrix.version }}
          path: evidence/bitbox02-${{ matrix.version }}
          retention-days: 90

  # Krux is third-party code: it runs in its own job with read-only permissions and no
  # secrets, at a pinned commit, and only its evidence (data) leaves the job. Bump
  # KRUX_COMMIT to test a newer commit.
  krux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # selfcustody/krux PR #925 (draft), head of notTanveer:feat/silent-payments-V2.
      # The older selfcustody/krux feat/silent-payments @ 0bec547 was tested before.
      KRUX_REPO: notTanveer/krux
      KRUX_COMMIT: f13f76d3d587da966ed7ea31dba9c2163cb44876
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch Krux at the pinned commit
        run: |
          git clone "https://github.com/$KRUX_REPO.git" "$RUNNER_TEMP/krux"
          git -C "$RUNNER_TEMP/krux" checkout "$KRUX_COMMIT"
          # Only embit: the other vendored libraries are not needed to sign a PSBT.
          git -C "$RUNNER_TEMP/krux" submodule update --init vendor/embit
      - name: Run all suites against Krux
        env:
          SW_KRUX_DIR: ${{ runner.temp }}/krux
        run: silentwitness run --adapter krux --suite all --out evidence/krux --note "CI ${{ github.sha }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: krux-evidence
          path: evidence/krux
          retention-days: 90

  # rust-psbt (crate psbt-v2, PR #425) is third-party code too: same rules as Krux. The crate
  # commit is pinned in tools/rust_psbt_harness/Cargo.toml and Cargo.lock; bump both to test a
  # newer one. Only its evidence leaves the job.
  rust-psbt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: rustup toolchain install stable --profile minimal
      - name: Build the harness at the pinned crate commit
        run: cargo +stable build --release --locked --manifest-path tools/rust_psbt_harness/Cargo.toml
      - name: Run all suites, and the extended vectors from its own PR, against rust-psbt
        run: silentwitness run --adapter rust-psbt --suite all-ext375 --out evidence/rust-psbt --note "CI ${{ github.sha }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-psbt-evidence
          path: evidence/rust-psbt
          retention-days: 90

  build:
    needs: [krux, rust-psbt, bitbox02]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[embit]'
      - name: Run all suites against embit
        # Exits non-zero when a signer fails a case; the scorecard shows it.
        run: silentwitness run --adapter embit --suite all --out evidence/ci --note "CI ${{ github.sha }}" || true
      - uses: actions/download-artifact@v4
        with:
          name: krux-evidence
          path: evidence/krux
      - uses: actions/download-artifact@v4
        with:
          name: rust-psbt-evidence
          path: evidence/rust-psbt
      - uses: actions/download-artifact@v4
        with:
          pattern: bitbox02-evidence-*
          path: evidence/bitbox02
      - name: Build scorecard
        run: silentwitness report --evidence evidence --out site
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/ci
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
